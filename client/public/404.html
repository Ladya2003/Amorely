<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <title>Amorely — app for couples: chat, shared calendar &amp; memories</title>
    <meta
      name="description"
      content="Amorely is a private space for couples: encrypted chat, shared calendar, photo feed, games, and daily questions — made for long-distance and everyday love."
    />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://amorely.love/" />
    <script type="text/javascript">
      // GitHub Pages: перенаправление deep-link на index.html (SPA)
      // 0 = custom domain / user site at domain root (not /Amorely project path)
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body>
    <p><a href="/">Amorely</a></p>
  </body>
</html>
